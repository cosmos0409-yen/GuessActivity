<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主持人｜全場搶答</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="center">
    <section id="setup">
      <h1>主持人</h1>
      <button id="create" class="btn">建立房間</button>
      <p id="setup-error" class="error" role="alert"></p>
    </section>

    <section id="lobby" hidden>
      <div class="join-panel">
        <figure class="qr-box">
          <div id="qr" role="img" aria-label="加入搶答的 QR code"></div>
          <figcaption>手機掃描加入</figcaption>
        </figure>
        <div>
          <p class="muted">房間碼</p>
          <p id="room-code" class="room-code"></p>
          <p class="muted">或開啟：<span id="join-url" class="join-url"></span></p>
        </div>
      </div>
      <p><strong id="player-count">0</strong> 人已加入（<span id="online-count">0</span> 人在線上）</p>
      <ul id="players" class="player-list" aria-live="polite"></ul>
      <p id="status" class="muted"></p>
    </section>
  </main>
  <script type="module" src="/host.js"></script>
</body>
</html>
