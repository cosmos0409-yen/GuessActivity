<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14163a">
  <title>加入｜司法官學院千元小學堂－選拔賽</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/play.css">
</head>
<body class="player">
  <header class="p-top">
    <img class="emblem" src="/brand/emblem.jpg" alt="司法官學院院徽" width="34" height="34">
    <strong>千元小學堂－選拔賽</strong>
    <span id="p-name" class="chip" hidden></span>
  </header>

  <main class="p-main">
    <form id="join-form" class="p-card" hidden>
      <h1>加入搶答</h1>
      <label>房間碼
        <input id="room" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="off">
      </label>
      <label>暱稱（1–12 個字）
        <input id="nickname" maxlength="12" required autocomplete="off" enterkeyhint="go">
      </label>
      <button class="btn" type="submit">加入</button>
      <p id="form-error" class="error" role="alert"></p>
    </form>

    <section id="waiting" class="p-center" hidden>
      <div class="pulse-ring" aria-hidden="true"></div>
      <p id="my-name" class="p-big"></p>
      <p>請看投影幕，等待主持人開始</p>
      <p class="muted">目前 <span id="count">0</span> 人已加入</p>
    </section>

    <section id="question" class="p-question" hidden>
      <div class="p-qhead">
        <span>第 <b id="q-number"></b> 題</span>
        <span id="sec-pill" class="sec-pill"><b id="q-seconds"></b> 秒</span>
      </div>
      <p class="hint">題目請看投影幕</p>
      <div id="choices" class="p-grid"></div>
    </section>

    <section id="submitted" class="p-center" hidden>
      <div id="s-choice" class="picked" aria-hidden="true"></div>
      <p class="p-big">已送出！</p>
      <p>剩 <b id="s-seconds"></b> 秒，等待公布答案</p>
    </section>

    <section id="result" class="p-result" hidden aria-live="polite">
      <div id="res-icon" class="res-icon" aria-hidden="true"></div>
      <p id="res-status" class="p-big"></p>
      <p id="res-points" class="res-points"></p>
      <p>總分 <b id="res-total"></b></p>
      <p>目前第 <b id="res-rank"></b> 名</p>
      <p class="muted">等待下一題…</p>
    </section>

    <section id="final" class="p-center" hidden aria-live="polite">
      <p class="muted">最終名次</p>
      <p id="fin-rank" class="rank-big"></p>
      <p>總分 <b id="fin-score"></b></p>
      <div id="fin-podium" class="verify" hidden>
        <p><b>恭喜進入前 3 名！</b></p>
        <p>上台時請出示這個畫面</p>
        <p>驗證碼</p>
        <p id="fin-code" class="code"></p>
      </div>
    </section>

    <section id="kicked" class="p-center" hidden aria-live="assertive">
      <div class="res-icon" aria-hidden="true">✕</div>
      <p class="p-big">你已被主持人移出房間</p>
      <p class="muted">如有疑問，請洽現場工作人員</p>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <script type="module" src="/play.js"></script>
</body>
</html>
